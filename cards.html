<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:wght@400;600&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: visible; }
  body {
    background: #ffffff;
    font-family: 'Times New Roman', Times, serif;
    min-height: 100vh;
    padding: 24px 0 60px;
    overflow-x: visible;
  }
  .section-title { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; line-height: 24px; color: #555; text-align: center; margin-bottom: 24px; padding: 0 20px; }
  .cards-stack { position: relative; width: 100%; max-width: none; margin: 0; display: flex; flex-direction: column; }
  .card { position: relative; width: 100%; border-radius: 20px; overflow: hidden; cursor: pointer; margin-bottom: -140px; transition: margin-bottom 0.4s cubic-bezier(.22,.68,0,1.1); box-shadow: none; }
  .card:last-child { margin-bottom: 0; }
  .card.expanded { margin-bottom: 12px; box-shadow: none; z-index: 50; }
  .card-img-wrap { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; }
  .card-img { max-width: 160px; max-height: 160px; object-fit: contain; display: block; }
  .card-num { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.7); backdrop-filter: blur(4px); border-radius: 50px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-family: 'Roboto Serif', serif; font-size: 14px; font-weight: 600; color: rgba(0,0,0,0.55); }
  .card-content { padding: 4px 20px 24px; }
  .card-title { font-family: 'Roboto Serif', serif; font-size: 22px; font-weight: 600; color: #1a1a1a; line-height: 1.25; margin-bottom: 10px; text-align: center; }
  .card-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
  .card.expanded .card-body { max-height: 400px; }
  .card-text { font-family: 'Times New Roman', Times, serif; font-size: 16px; line-height: 1.65; color: #2a2a2a; }
  .card-text p { margin-bottom: 8px; }
  .card-text p:last-child { margin-bottom: 0; }
  .card-1  { background: #F5E6C8; }
  .card-2  { background: #C8DCE8; }
  .card-3  { background: #C8DCC8; }
  .card-4  { background: #E8D8B8; }
  .card-5  { background: #C8D8C0; }
  .card-6  { background: #D8E8D0; }
  .card-7  { background: #F0D0D0; }
  .card-8  { background: #F0DEC8; }
  .card-9  { background: #C8DCCC; }
  .card-10 { background: #E8E0D0; }
</style>
</head>
<body>

<p class="section-title" id="section-title"></p>

<div class="cards-stack" id="cards-stack"></div>

<script>

      },

      {

};

const IMAGES = [
  'images/oatmeal_1.png',
  'images/fish_2.png',
  'images/avocado_3.png',
  'images/nuts_and_almonds_4.png',
  'images/legumes_5.png',
  'images/olive_oil_6.png',
  'images/berries_7.png',
  'images/citrus_fruits_8.png',
  'images/green_vegetables_9.png',
  'images/flax_seeds_10.png'
];

const BG_CLASSES = ['card-1','card-2','card-3','card-4','card-5','card-6','card-7','card-8','card-9','card-10'];

// Определяем язык: 1) URL param ?lang=  2) язык браузера  3) fallback ru
function detectLang() {
  const param = new URLSearchParams(location.search).get('lang');
  if (param && CARDS_I18N[param]) return param;
  const nav = (navigator.language || 'ru').slice(0, 2).toLowerCase();
  return CARDS_I18N[nav] ? nav : 'ru';
}

let LANG = detectLang();

function render() {
  const i18n = CARDS_I18N[LANG] || CARDS_I18N['ru'];
  document.documentElement.lang = LANG;

  // Заголовок
  document.getElementById('section-title').innerHTML = i18n.title;

  // Карточки
  const stack = document.getElementById('cards-stack');
  stack.innerHTML = '';
  i18n.cards.forEach((card, idx) => {
    const div = document.createElement('div');
    div.className = `card ${BG_CLASSES[idx]}`;
    div.onclick = () => toggleCard(div);
    div.innerHTML = `
      <div class="card-img-wrap">
        <img class="card-img" src="${IMAGES[idx]}" alt="" loading="lazy">
        <span class="card-num">${idx + 1}</span>
      </div>
      <div class="card-content">
        <div class="card-title">${card.title}</div>
        <div class="card-body"><div class="card-text"><p>${card.text}</p></div></div>
      </div>`;
    stack.appendChild(div);
    div.querySelector('.card-img').addEventListener('load', notifyParentResize);
  });

  // Раскрываем последнюю карточку
  expandedCard = null;
  const last = stack.querySelector('.card:last-child');
  if (last) {
    last.classList.add('expanded');
    expandedCard = last;
  }

  requestAnimationFrame(() => requestAnimationFrame(() => {
    notifyParentResize();
    setTimeout(notifyParentResize, 100);
    setTimeout(notifyParentResize, 450);
  }));
}

// ── Логика карточек ───────────────────────────────────────────────────────
let expandedCard = null;

function notifyParentResize() {
  try {
    if (window.parent && typeof window.parent.resizeEduIframe === 'function') {
      window.parent.resizeEduIframe();
    }
  } catch (e) {}
}

function toggleCard(card) {
  if (expandedCard === card) {
    card.classList.remove('expanded');
    expandedCard = null;
    setTimeout(notifyParentResize, 450);
    return;
  }
  if (expandedCard) expandedCard.classList.remove('expanded');
  card.classList.add('expanded');
  expandedCard = card;
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
  setTimeout(notifyParentResize, 50);
  setTimeout(notifyParentResize, 450);
}

if (typeof ResizeObserver !== 'undefined') {
  const stack = document.getElementById('cards-stack');
  const ro = new ResizeObserver(() => notifyParentResize());
  ro.observe(stack);
}

// Слушаем postMessage от родителя на случай смены языка без перезагрузки
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'setLang' && CARDS_I18N[e.data.lang]) {
    LANG = e.data.lang;
    render();
  }
});

// Запуск
render();
</script>
</body>
</html>
