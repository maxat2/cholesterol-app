    .hero { padding: 48px 20px 32px; border-bottom: 1px solid var(--line); }
    .hero-inner { max-width: 680px; margin: 0 auto; }
    .hero-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted2); margin-bottom: 12px; }

    .summary-wrap { max-width: 680px; margin: 0 auto; }

    .summary-list li::before { content: '→'; font-weight: 700; color: var(--accent); flex-shrink: 0; margin-top: 1px; }
    .content { max-width: 680px; margin: 0 auto; padding: 0 20px 80px; }
    .section { padding: 32px 0; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: none; }
    .section-num { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted2); margin-bottom: 8px; }
    .section-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); margin-bottom: 16px; line-height: 1.2; }
    .section p { font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
    .section p:last-child { margin-bottom: 0; }
    .data-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
    .data-table th { text-align: left; padding: 8px 12px; background: #f5f5f5; font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.5; }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table td:first-child { font-weight: 600; white-space: nowrap; color: var(--accent); }
    .tag { display: inline-block; background: #f0f0f0; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 500; margin: 2px 2px 2px 0; }

    .highlight { background: #f9f9f9; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 14px 16px; margin: 16px 0; font-size: 13px; line-height: 1.6; }
    .contact-card { margin-top: 16px; border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }

    .contact-label { color: var(--muted); font-size: 12px; min-width: 70px; }
    .contact-value { font-weight: 600; color: var(--accent); }

function detectLang() {
  const p = new URLSearchParams(window.location.search).get('lang');
  if (p && T[p]) return p;
  const ls = localStorage.getItem('userLocale');
  if (ls && T[ls]) return ls;
  const nav = (navigator.language || '').slice(0, 2).toLowerCase();
  return T[nav] ? nav : 'en';
}

const LANG = detectLang();
function t(key) { return T[LANG][key] !== undefined ? T[LANG][key] : (T['en'][key] || key); }

function render() {
  document.documentElement.lang = LANG;
  document.title = t('page.title');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.innerHTML = t(el.getAttribute('data-i18n'));
  });

  document.getElementById('summary-list').innerHTML =
    t('summary.items').map(item => `<li>${item}</li>`).join('');

  const sensitiveRow = t('data.sensitive_row');
  document.getElementById('data-table-body').innerHTML =
    t('data.rows').map((row, i) => `<tr>
      <td>${row[0]}</td>
      <td><span class="tag${i === sensitiveRow ? ' tag--sensitive' : ''}">${row[1]}</span></td>
      <td>${row[2]}</td>
    </tr>`).join('');

  document.getElementById('third-party-table-body').innerHTML =
    t('third.rows').map(row => `<tr>
      <td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td>
    </tr>`).join('');
}

render();
</script>
